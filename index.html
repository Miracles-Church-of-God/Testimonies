<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonies</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background:#f4f6f9;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:700px;
    }

    form{
        background:#fff;
        padding:40px;
        border-radius:12px;
        box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .logo{
        text-align:center;
        margin-bottom:20px;
    }

    .logo img{
        width:120px;
        max-width:100%;
        height:auto;
    }

    h2{
        text-align:center;
        color:#222;
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        color:#666;
        margin-bottom:30px;
        font-size:15px;
    }

    .form-group{
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#333;
    }

    input,
    textarea{
        width:100%;
        padding:12px 15px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:16px;
        transition:0.3s;
    }

    input:focus,
    textarea:focus{
        outline:none;
        border-color:#0066cc;
        box-shadow:0 0 5px rgba(0,102,204,0.3);
    }

    textarea{
        resize:vertical;
    }

    button{
        width:100%;
        padding:14px;
        background:#0066cc;
        color:white;
        border:none;
        border-radius:6px;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#0052a3;
    }

    @media (max-width: 768px){

        form{
            padding:25px;
        }

        .logo img{
            width:90px;
        }

        h2{
            font-size:24px;
        }

        input,
        textarea,
        button{
            font-size:15px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <form action="https://formspree.io/f/mgojzgrr" method="post">

        <div class="logo">
            <img src="H&M Logo Without words_LogoMakr-3cbuVR.png" alt="Logo">
        </div>

        <h2>TESTIMONY</h2>

        <p class="subtitle">
            Please fill in the details below and we will praise and thank God together.
        </p>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" required>
        </div>

        <div class="form-group">
            <label for="country">Country of Residence</label>
            <input type="text" id="country" name="Country of Residence" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="Email" required>
        </div>

        <div class="form-group">
            <label for="Testimony">Testimony(Testimonies)</label>
            <textarea id="prayer-request"
                      name="Testimonies"
                      rows="8"
                      required></textarea>
        </div>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
